[project]
name = "tuxhe-engineer-practice"
version = "0.1.0"
description = "Unsolved exercises from the Tuxhe Engineer Shorts"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.5", "pyright==1.1.414"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
include = ["python"]
